<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>dui · 캡처 기록</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#202923;font:15px/1.5 system-ui,sans-serif}
main{max-width:1500px;margin:auto;padding:32px}h1{font-size:28px;margin:0 0 20px}label{display:grid;gap:4px;font-weight:600}
select{font:inherit;padding:8px;max-width:100%;min-width:0;border:1px solid #a9b4ac;border-radius:5px;background:white;color:inherit}
#picker{display:grid;gap:14px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
article{margin-top:18px;padding:16px;background:white;border:1px solid #d3d9d5;border-radius:8px}
h2{font-size:16px;margin:0 0 10px;overflow-wrap:anywhere}figure{margin:0;min-width:0}figcaption{margin:4px 0;color:#45564b}img{display:block;max-width:100%;max-height:420px;object-fit:contain}
#summary{margin:16px 0}a{color:#245c46}.links{display:flex;gap:20px}@media(max-width:600px){main{padding:12px}.pair{gap:6px}#picker .pair{grid-template-columns:1fr}}
</style><main><h1>캡처 기록</h1><div id="picker">
<label>프로젝트<select id="project"></select></label>
<div class="pair"><label>이전 캡처<select id="before"></select></label><label>현재 캡처<select id="after"></select></label></div></div>
<p id="summary"></p><div id="links" class="links"></div><div id="cells"></div></main>
<script type="application/json" id="data">/*RUNS*/</script><script>/*VIEW*/</script></html>
