<!doctype html>
<meta charset="utf-8" />
<title>GPUI model and IME probe</title>
<style>
  html,
  body {
    margin: 0;
    height: 100%;
  }
  canvas {
    display: block;
  }
</style>
<script type="module">
  import init, { run } from "./dui_gpui_web_probe.js";
  window.probe = { values: [], composition: [] };
  window.recordProbeValue = (value) => window.probe.values.push(value);
  for (const type of ["compositionstart", "compositionupdate", "compositionend"]) {
    document.addEventListener(
      type,
      (event) => window.probe.composition.push([type, event.data]),
      true,
    );
  }
  const [, model, font] = await Promise.all([
    init(),
    fetch("./model.json").then((r) => r.text()),
    fetch("./IBMPlexSans-Regular.ttf").then((r) => r.arrayBuffer()),
  ]);
  run(model, new Uint8Array(font));
</script>
