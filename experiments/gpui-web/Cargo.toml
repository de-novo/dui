[package]
name = "dui-gpui-web-probe"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
gpui-kit = { version = "=0.11.0", default-features = false, features = ["component"] }
gpui = { package = "gpui-pre", version = "=0.3.14" }
serde_json = "1"
wasm-bindgen = "=0.2.127"
console_error_panic_hook = "0.1"
