[workspace]
members = [
  "crates/dui-core",
  "crates/dui-ports",
  "crates/dui-lang-typescript",
  "crates/dui-storage",
  "crates/dui-app",
  "crates/dui",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.2.0"

[workspace.dependencies]
ureq = { version = "3.5.2", default-features = false, features = ["native-tls-no-default", "gzip"] }
brotli-decompressor = "6.2.0"
dui-lang-typescript = { path = "crates/dui-lang-typescript" }
tree-sitter = "0.25.10"
tree-sitter-css = "0.25.0"
tree-sitter-typescript = "0.23.2"
base64 = "0.22"
csv = "1"
dui-app = { path = "crates/dui-app" }
dui-core = { path = "crates/dui-core" }
dui-ports = { path = "crates/dui-ports" }
dui-storage = { path = "crates/dui-storage" }
png = "0.18.1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"

# Image decoding, pixel comparison and hashing run for every capture; unoptimized they are
# 20–27× slower, and checks and local runs use the development build (#332).
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.dui-app]
opt-level = 3
