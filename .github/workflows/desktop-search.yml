name: Desktop screen search
on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "examples/dispatch/**"
      - "scripts/check-desktop-search.mts"
      - ".github/workflows/desktop-search.yml"
      - "package.json"
permissions:
  contents: read

jobs:
  native-search:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
      - run: rustup update stable --no-self-update
      - run: npm ci && npm ci --prefix apps/canvas
      - run: npm run check:desktop-search
        env:
          RUSTUP_TOOLCHAIN: stable
          DUI_CHROMIUM: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
