name: Source style

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
      - name: Verify native screen-map connections
        run: |
          rustc --edition=2024 --test apps/desktop/src/screen_graph.rs -o "$RUNNER_TEMP/screen-graph-tests"
          "$RUNNER_TEMP/screen-graph-tests"
      - name: Check Cargo workspace dependency inheritance
        run: |
          python3 - <<'PYTHON'
          import json, subprocess, tomllib
          from pathlib import Path
          workspace = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--locked", "--no-deps", "--format-version=1"]
          ))
          for package in workspace["packages"]:
              path = Path(package["manifest_path"])
              manifest = tomllib.loads(path.read_text())
              for table in [manifest, *manifest.get("target", {}).values()]:
                  for kind in ["dependencies", "build-dependencies", "dev-dependencies"]:
                      for name, spec in table.get(kind, {}).items():
                          if not isinstance(spec, dict) or spec.get("workspace") is not True:
                              raise SystemExit(f"{path}: inherit {name} from workspace.dependencies")
          PYTHON
      - run: npm run deps:check
      - run: npm run check:deps
      - run: npm ci
      - run: npm run check:style
      - name: Validate the versioned source model
        run: npm run check:source-model
      - name: Keep the source model reader building for wasm
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --locked -p dui-core --target wasm32-unknown-unknown
      - run: npm ci --prefix apps/canvas
      - run: npm run check:tsx-model
      - run: npm test --prefix apps/canvas
      - run: npm run build --prefix apps/canvas
      - run: npm ci --prefix packages/db
      - run: npm --prefix packages/db run check
      - run: npm test --prefix packages/db
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm ci --prefix apps/canvas
      - run: npm ci --prefix fixtures/replay
      - run: npm ci --prefix fixtures/toggle
      - name: Inspect committed React instances, M1 gates, and i18n in Chrome
        run: |
          export DUI_CHROMIUM="$(command -v google-chrome)"
          "$DUI_CHROMIUM" --version
          npm run check:inspect
          npm run check:m1
          npm run check:i18n
          npm run check:cache
          npm run check:recheck
          npm run check:diff
          npm run check:viewer
          npm run check:viewer-renders
          node scripts/check-responsive-preview.mts
          node scripts/verify-pages-demo.mts --layout-only
          npm run check:example
          npm run check:transitions
          npm run check:comments
          npm run check:audit
          npm run check:design-audit
          npm run check:query-params
          npm run check:p2-rules
          npm run check:real-api
          npm run check:branch-diff
          npm run check:universal-web
          npm run check:tui
          npm run check:android
          npm run check:ios
          npm run check:electron
          npm run check:radix-nextjs
          npm run check:box-model
          npm run check:compiler-oracles
          npm run check:reliability
          npm run check:settle
          npm run check:browserless-map
          npm run check:map-thumbnails
          npm run check:fact-overlays
          npm run check:html-snapshots
          npm run check:html-cards
          npm run check:auth-pr-diff
          npm run check:vite7
