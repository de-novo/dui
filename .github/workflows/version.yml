name: Release version consistency
on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm ci --prefix apps/canvas
      - run: npm run check:version -- --published
      - run: python3 scripts/check-release-builds.py
      - name: Verify the pushed release tag against the built CLI
        if: github.ref_type == 'tag'
        run: |
          cargo build --locked --bin dui
          target/debug/dui --version | jq -e --arg ref "$GITHUB_REF_NAME" 'if ($ref | test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")) then .tag == $ref else .tag == null or .tag == ("v" + .version) end'
