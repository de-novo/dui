<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script>
      (() => {
        const key = "dui.theme";
        const system = matchMedia("(prefers-color-scheme: dark)");
        let preference = "system";
        try {
          const saved = localStorage.getItem(key);
          if (saved === "light" || saved === "dark") preference = saved;
        } catch {
          // Storage may be unavailable in an embedded viewer.
        }
        function apply() {
          document.documentElement.dataset.theme =
            preference === "system" ? (system.matches ? "dark" : "light") : preference;
        }
        apply();
        system.addEventListener("change", apply);
        window.duiTheme = {
          get preference() {
            return preference;
          },
          set preference(value) {
            preference = value;
            apply();
            try {
              localStorage.setItem(key, value);
            } catch {
              // Keep the selection for the current page.
            }
          },
        };
      })();
    </script>
    <link rel="stylesheet" href="/src/preview.css" />
    <link rel="icon" href="data:," />
    <title>dui · Screen map</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/preview.tsx"></script>
  </body>
</html>
